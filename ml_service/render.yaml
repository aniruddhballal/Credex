services:
  - type: web
    name: credex-ml-service
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false   # set manually in Render dashboard to Node backend URL
    autoDeploy: true